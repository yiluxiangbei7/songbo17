<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 小米商城</title>
    <link rel="stylesheet" href="css/songbo.css">
</head>
<body>
    <header id="songbo_header"></header>

    <main>
        <div class="songbo_form_card">
            <h2>登录小米商城</h2>
            <div class="songbo_field">
                <label>邮箱</label>
                <input type="text" id="songbo_email" placeholder="请输入注册邮箱">
                <span class="songbo_err" id="songbo_email_err"></span>
            </div>
            <div class="songbo_field">
                <label>密码</label>
                <input type="password" id="songbo_pwd" placeholder="请输入密码（至少 6 位）">
                <span class="songbo_err" id="songbo_pwd_err"></span>
            </div>
            <button class="songbo_btn" id="songbo_login_btn">登 录</button>
            <p class="songbo_form_foot">还没有账号？<a href="register.html">立即注册</a></p>
        </div>
    </main>

    <footer id="songbo_footer"></footer>

    <script src="js/songbo_config.js"></script>
    <script src="js/songbo_api.js"></script>
    <script src="js/songbo_auth.js"></script>
    <script src="js/songbo_common.js"></script>
    <script src="js/songbo_login.js"></script>
</body>
</html>
