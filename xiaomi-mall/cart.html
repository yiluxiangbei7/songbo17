<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 小米商城</title>
    <link rel="stylesheet" href="css/songbo.css">
</head>
<body>
    <header id="songbo_header"></header>

    <main class="songbo_wrap" style="margin-top:18px;">
        <div class="songbo_panel">
            <h3>我的购物车</h3>
            <div id="songbo_cart_box"></div>
        </div>
        <div class="songbo_cart_foot" id="songbo_cart_foot" style="display:none;">
            <button class="songbo_op_btn songbo_del" id="songbo_cart_clear">清空购物车</button>
            <span>共 <b id="songbo_cart_total_count" style="color:#ff6700;">0</b> 件商品</span>
            <span>合计：<b class="songbo_price" id="songbo_cart_total">0</b></span>
            <button class="songbo_btn" id="songbo_cart_checkout">去结算</button>
        </div>
    </main>

    <!-- 结算弹窗 -->
    <div class="songbo_modal_mask" id="songbo_checkout_mask">
        <div class="songbo_modal">
            <h3>填写收货信息</h3>
            <div class="songbo_field">
                <label>收货人</label>
                <input id="songbo_co_receiver" placeholder="请输入收货人姓名">
                <span class="songbo_err" id="songbo_co_receiver_err"></span>
            </div>
            <div class="songbo_field">
                <label>手机号</label>
                <input id="songbo_co_phone" placeholder="11 位手机号">
                <span class="songbo_err" id="songbo_co_phone_err"></span>
            </div>
            <div class="songbo_field">
                <label>收货地址</label>
                <input id="songbo_co_address" placeholder="省市区 + 详细地址">
                <span class="songbo_err" id="songbo_co_address_err"></span>
            </div>
            <div class="songbo_modal_foot">
                <button class="songbo_btn songbo_btn_ghost" id="songbo_co_cancel">取消</button>
                <button class="songbo_btn" id="songbo_co_ok">提交订单</button>
            </div>
        </div>
    </div>

    <footer id="songbo_footer"></footer>

    <script src="js/songbo_config.js"></script>
    <script src="js/songbo_api.js"></script>
    <script src="js/songbo_auth.js"></script>
    <script src="js/songbo_common.js"></script>
    <script src="js/songbo_cart.js"></script>
</body>
</html>
