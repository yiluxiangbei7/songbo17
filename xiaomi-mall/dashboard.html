<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据仪表盘 - 小米商城</title>
    <link rel="stylesheet" href="css/songbo.css">
</head>
<body>
    <header id="songbo_header"></header>

    <main class="songbo_wrap" style="margin-top:18px;">
        <!-- 统计卡片 -->
        <div class="songbo_stat_grid" id="songbo_stat_grid">
            <div class="songbo_stat_card"><span>商品总数</span><b id="songbo_st_products">—</b></div>
            <div class="songbo_stat_card"><span>库存总量</span><b id="songbo_st_stock">—</b></div>
            <div class="songbo_stat_card"><span>订单总数</span><b id="songbo_st_orders">—</b></div>
            <div class="songbo_stat_card"><span>销售额合计</span><b id="songbo_st_sales">—</b></div>
        </div>

        <!-- 图表：分类占比饼图 + 销量TOP条形图 -->
        <div class="songbo_chart_grid">
            <div class="songbo_chart_box">
                <h4>各分类商品数量占比</h4>
                <div class="songbo_chart" id="songbo_chart_pie"></div>
            </div>
            <div class="songbo_chart_box">
                <h4>商品销量 TOP 8</h4>
                <div class="songbo_chart" id="songbo_chart_bar"></div>
            </div>
        </div>

        <!-- 图表：价格分布折线图 -->
        <div class="songbo_chart_grid" style="margin-top:16px;">
            <div class="songbo_chart_box" style="grid-column:1/-1;">
                <h4>商品价格分布（按价格升序）</h4>
                <div class="songbo_chart" id="songbo_chart_line"></div>
            </div>
        </div>
    </main>

    <footer id="songbo_footer"></footer>

    <!-- ECharts：指导书允许的第三方库，本地引入（禁 CDN，评分项） -->
    <script src="js/lib/echarts.min.js"></script>
    <script src="js/songbo_config.js"></script>
    <script src="js/songbo_api.js"></script>
    <script src="js/songbo_auth.js"></script>
    <script src="js/songbo_common.js"></script>
    <script src="js/songbo_dashboard.js"></script>
</body>
</html>
