<!DOCTYPE html>
<!--
  文件名: admin.html
  作者: 宋博 (24001011017)
  创建时间: 2026-11-27
  功能说明: 知乎新闻 · 后台管理页（不计入前台 8 页）——管理 3 个实体：
            新闻 news / 话题 topics / 评论 comments，每实体具备
            列表、搜索、分页、新增、编辑、删除；写操作携带登录 JWT，
            数据库 RLS 拦截未登录请求（401）；页面加载即校验登录态，
            未登录跳转 login.html（鉴权拦截）
  数据来源: Supabase REST API（写操作需登录，RLS 放行 authenticated）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 · 知乎新闻 ｜ 宋博 songbo17 24001011017</title>
    <link rel="stylesheet" href="css/songbo.css">
</head>
<body>
    <header id="songbo_header"></header>

    <main class="songbo_main">
        <div class="songbo_section_title" style="margin-top:10px;">后台管理 <span id="songbo_admin_user" style="font-size:12px;color:#646464;font-weight:400;"></span></div>

        <!-- 实体切换 tab -->
        <div class="songbo_admin_tabs" id="songbo_admin_tabs">
            <button class="songbo_btn songbo_btn_small" data-entity="news">新闻管理</button>
            <button class="songbo_btn songbo_btn_ghost songbo_btn_small" data-entity="topics">话题管理</button>
            <button class="songbo_btn songbo_btn_ghost songbo_btn_small" data-entity="comments">评论管理</button>
        </div>

        <div class="songbo_admin_panel">
            <div class="songbo_admin_toolbar">
                <input type="text" id="songbo_admin_kw" placeholder="搜索当前实体数据…">
                <div class="songbo_spacer"></div>
                <button class="songbo_btn songbo_btn_small" id="songbo_btn_add">＋ 新增</button>
            </div>
            <div id="songbo_admin_table_box"></div>
            <div class="songbo_pager" id="songbo_admin_pager"></div>
        </div>
    </main>

    <!-- 新增/编辑弹层 -->
    <div class="songbo_mask" id="songbo_admin_mask">
        <div class="songbo_modal">
            <button class="songbo_modal_close" id="songbo_admin_close">✕</button>
            <h2 id="songbo_admin_modal_title">编辑</h2>
            <div id="songbo_admin_form"></div>
            <div class="songbo_modal_foot">
                <button class="songbo_btn songbo_btn_ghost" id="songbo_admin_cancel">取消</button>
                <button class="songbo_btn" id="songbo_admin_save">保存</button>
            </div>
        </div>
    </div>

    <footer id="songbo_footer"></footer>

    <script src="js/songbo_config.js"></script>
    <script src="js/songbo_api.js"></script>
    <script src="js/songbo_auth.js"></script>
    <script src="js/songbo_common.js"></script>
    <script src="js/songbo_admin.js"></script>
</body>
</html>
