<!DOCTYPE html>
<!--
  文件名: list.html
  作者: 宋博 (24001011017)
  创建时间: 2026-11-27
  功能说明: 知乎新闻 · 栏目/列表页（二级页面）——话题 tab 筛选（JS效果②）、
            关键词过滤（JS效果③）、客户端分页（JS效果④），支持 URL 传参
            ?topic=话题名（从首页话题条跳入）
  数据来源: Supabase REST API（topics / news 表）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话题列表 · 知乎新闻 ｜ 宋博 songbo17 24001011017</title>
    <link rel="stylesheet" href="css/songbo.css">
</head>
<body>
    <header id="songbo_header"></header>

    <main class="songbo_main">
        <div class="songbo_section_title">按话题浏览</div>
        <div class="songbo_topics_bar" id="songbo_topics_bar">
            <span class="songbo_status" style="padding:8px 0;">正在加载话题…</span>
        </div>

        <div class="songbo_search_bar">
            <input type="text" id="songbo_kw" placeholder="在结果中过滤关键词（标题/摘要实时匹配）">
        </div>

        <div id="songbo_news_list" class="songbo_news_list">
            <div class="songbo_status">正在加载新闻列表…</div>
        </div>
        <div class="songbo_pager" id="songbo_pager"></div>
    </main>

    <footer id="songbo_footer"></footer>

    <script src="js/songbo_config.js"></script>
    <script src="js/songbo_api.js"></script>
    <script src="js/songbo_auth.js"></script>
    <script src="js/songbo_common.js"></script>
    <script src="js/songbo_list.js"></script>
</body>
</html>
