<!DOCTYPE html>
<!--
  文件名: index.html
  作者: 宋博 (24001011017)
  创建时间: 2026-11-27
  功能说明: 知乎新闻 · 首页（一级页面）——轮播图（精选新闻）、话题导航、
            新闻推荐列表、canvas 粒子背景动画
  数据来源: Supabase REST API（news / topics 表）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知乎新闻 · 首页 ｜ 宋博 songbo17 24001011017</title>
    <link rel="stylesheet" href="css/songbo.css">
</head>
<body>
    <header id="songbo_header"></header>

    <!-- 页头横幅 + canvas 粒子背景（动画③ canvas） -->
    <div class="songbo_hero songbo_canvas_wrap" style="max-width:1080px;">
        <canvas id="songbo_canvas"></canvas>
        <h1 style="position:relative;">有问题，就会有<span>新闻</span>。</h1>
        <p style="position:relative;">数据全部来自 Supabase 云数据库（PostgreSQL），前端通过 REST API 匿名只读访问。</p>
        <div class="songbo_hero_meta" style="position:relative;">
            <b>三级项目</b> ｜ 《高级网页设计I》· 宋博 · 学号 24001011017 ｜ 数据库：Supabase（BAAS · RLS 已开启）
        </div>
    </div>

    <main class="songbo_main">
        <!-- 轮播图（JS效果① 轮播图；指示点含动画②） -->
        <div class="songbo_carousel" id="songbo_carousel">
            <div class="songbo_status" style="width:100%;line-height:260px;">正在加载精选新闻…</div>
        </div>

        <!-- 话题筛选条（数据来自 topics 表，点击跳列表页） -->
        <div class="songbo_topics_bar" id="songbo_topics_bar" style="margin-top:20px;">
            <span class="songbo_status" style="padding:8px 0;">正在加载话题…</span>
        </div>

        <!-- 新闻推荐列表（数据来自 news 表） -->
        <div class="songbo_section_title">今日热榜</div>
        <div id="songbo_news_list" class="songbo_news_list">
            <div class="songbo_status">正在从 Supabase 加载新闻…</div>
        </div>
    </main>

    <footer id="songbo_footer"></footer>

    <!-- 脚本：配置 → 封装 → 鉴权 → 公共UI → 页面逻辑（顺序不能乱） -->
    <script src="js/songbo_config.js"></script>
    <script src="js/songbo_api.js"></script>
    <script src="js/songbo_auth.js"></script>
    <script src="js/songbo_common.js"></script>
    <script src="js/songbo_index.js"></script>
</body>
</html>
