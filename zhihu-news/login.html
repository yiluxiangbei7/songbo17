<!DOCTYPE html>
<!--
  文件名: login.html
  作者: 宋博 (24001011017)
  创建时间: 2026-11-27
  功能说明: 知乎新闻 · 登录页——邮箱/密码正则校验（JS效果⑤表单校验）、
            调用 Supabase Auth 登录接口（密码 bcrypt 加密存储，高阶功能项）、
            JWT 存 localStorage 实现登录态保持
  数据来源: Supabase Auth（/auth/v1/token?grant_type=password）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 知乎新闻 ｜ 宋博 songbo17 24001011017</title>
    <link rel="stylesheet" href="css/songbo.css">
</head>
<body>
    <header id="songbo_header"></header>

    <main class="songbo_main">
        <div class="songbo_form_card">
            <h1>登录知乎新闻</h1>
            <p class="songbo_form_sub">登录后可收藏新闻、使用后台管理</p>
            <p class="songbo_form_tip" id="songbo_tip"></p>

            <div class="songbo_field">
                <label>邮箱</label>
                <input type="email" id="songbo_email" placeholder="example@mail.com">
                <div class="songbo_field_msg" id="songbo_email_msg"></div>
            </div>
            <div class="songbo_field">
                <label>密码（6 位以上）</label>
                <input type="password" id="songbo_pwd" placeholder="请输入密码">
                <div class="songbo_field_msg" id="songbo_pwd_msg"></div>
            </div>
            <button class="songbo_btn songbo_form_submit" id="songbo_btn_login">登 录</button>
            <div class="songbo_form_foot">还没有账号？<a href="register.html">去注册 →</a></div>
        </div>
    </main>

    <footer id="songbo_footer"></footer>

    <script src="js/songbo_config.js"></script>
    <script src="js/songbo_api.js"></script>
    <script src="js/songbo_auth.js"></script>
    <script src="js/songbo_common.js"></script>
    <script src="js/songbo_login.js"></script>
</body>
</html>
