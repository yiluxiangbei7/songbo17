<!DOCTYPE html>
<!--
  文件名: dashboard.html
  作者: 宋博 (24001011017)
  创建时间: 2026-11-27
  功能说明: 知乎新闻 · 数据仪表盘——统计卡片（新闻总数/总阅读/评论数/话题数）
            + ECharts 图表（分类新闻占比饼图、话题关注度条形图、新闻阅读量
            折线图），全部数据来自 Supabase REST 接口真实数据（非写死）；
            页面加载即校验登录态，未登录跳转 login.html
  数据来源: Supabase REST API（news / topics / comments 全量聚合）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据仪表盘 · 知乎新闻 ｜ 宋博 songbo17 24001011017</title>
    <link rel="stylesheet" href="css/songbo.css">
</head>
<body>
    <header id="songbo_header"></header>

    <main class="songbo_main">
        <div class="songbo_section_title" style="margin-top:10px;">数据仪表盘 <span style="font-size:12px;color:#646464;font-weight:400;">图表由 Supabase 接口真实数据驱动（ECharts 本地引入）</span></div>

        <!-- 统计卡片（接口真实数据） -->
        <div class="songbo_stat_row" id="songbo_stat_row">
            <div class="songbo_stat_card"><b id="songbo_stat_news">—</b><span>新闻总数</span></div>
            <div class="songbo_stat_card"><b id="songbo_stat_views">—</b><span>累计阅读量</span></div>
            <div class="songbo_stat_card"><b id="songbo_stat_comments">—</b><span>评论总数</span></div>
            <div class="songbo_stat_card"><b id="songbo_stat_topics">—</b><span>话题总数</span></div>
        </div>

        <!-- 图表网格 -->
        <div class="songbo_chart_grid">
            <div class="songbo_chart_card">
                <h3>各分类新闻占比</h3>
                <p>数据来源：GET /rest/v1/news（category 字段聚合）</p>
                <div class="songbo_chart_box" id="songbo_chart_pie"></div>
            </div>
            <div class="songbo_chart_card">
                <h3>话题关注度排行</h3>
                <p>数据来源：GET /rest/v1/topics（followers 字段）</p>
                <div class="songbo_chart_box" id="songbo_chart_bar"></div>
            </div>
            <div class="songbo_chart_card" style="grid-column: 1 / -1;">
                <h3>新闻阅读量对比</h3>
                <p>数据来源：GET /rest/v1/news（views 字段，按阅读量降序）</p>
                <div class="songbo_chart_box" id="songbo_chart_line" style="height:340px;"></div>
            </div>
        </div>
    </main>

    <footer id="songbo_footer"></footer>

    <script src="js/lib/echarts.min.js"></script>
    <script src="js/songbo_config.js"></script>
    <script src="js/songbo_api.js"></script>
    <script src="js/songbo_auth.js"></script>
    <script src="js/songbo_common.js"></script>
    <script src="js/songbo_dashboard.js"></script>
</body>
</html>
